      <script>
      // Logo F1 per header e favicon: prima img/f1-logo.svg (se lo aggiungi), poi il logo ufficiale F1 da formula1.com; se nulla si carica restano testo ed emoji
      (function () {
        var L = ["img/f1-logo.svg", "https://media.formula1.com/image/upload/c_lfill,w_128,h_128/v1740000001/fom-website/2026/F1%20App%20Store%20Logo/f1-app-logo.svg"];
        (function t(i) {
          if (i >= L.length) return;
          var m = new Image();
          m.onload = function () { document.getElementById("fav").href = L[i]; var h = document.getElementById("f1l"); h.src = L[i]; h.hidden = false; };
          m.onerror = function () { t(i + 1); };
          m.src = L[i];
        })(0);
      })();
    </script>
